*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

:root{

  --bg:#f8fafc;--card:#fff;--soft:#f1f5f9;--bd:#e2e8f0;

  --win:#16a34a;--lose:#dc2626;

  --premium-bg:#fff;--premium-text:#0f172a;--premium-bd:#cbd5e1;
  --green:#16a34a;--green-l:#22c55e;--green-bg:#f0fdf4;--green-bd:#bbf7d0;

}
body.dark{
  --accent:#4ade80;--accent-l:#22c55e;--accent-bg:#0f2818;--accent-bd:#14532d;

html,body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{

}
body.dark{
  background:linear-gradient(160deg,#0c1a0e 0%,#0f172a 50%,#0c1424 100%);

}
body.lang-mm{font-family:'Padauk','Inter',system-ui,sans-serif}

.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:12px}

.brand{padding:2px 2px 0}
.brand-title{

  font-size:15px;font-weight:800;letter-spacing:-.01em;line-height:1.3;
  color:var(--text);transition:color .25s;
}
.brand-title .sep{color:var(--subtle);font-weight:400;opacity:.6}
.brand-ver{
  display:inline-flex;align-items:center;padding:2px 8px;
  font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  color:var(--accent);background:var(--accent-bg);
  border:1px solid var(--accent-bd);border-radius:999px;
  transition:color .25s,background .25s,border-color .25s;
}
.free-tag{
  display:inline-flex;align-items:center;padding:2px 8px;
  font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:#fff;background:var(--green-l);
  border:1px solid var(--green);border-radius:999px;
}
.brand-sub{
  margin-top:2px;font-size:11.5px;font-weight:600;color:var(--muted);
  transition:color .25s;
}

.live-bar{display:flex;align-items:center;justify-content:center;gap:8px;padding:6px 0 2px}
.live-dot{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 10px;font-size:9.5px;font-weight:800;letter-spacing:.08em;
  color:var(--green);background:var(--green-bg);
  border:1px solid var(--green-bd);border-radius:999px;

}
.live-dot::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--green-l);animation:pulse 1.4s ease-in-out infinite}

.live-label{font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.pred-val{

.pred-val.big{color:var(--big)}
.pred-val.small{color:var(--small)}
.pred-val.low{color:var(--rate-low)}

.sys-label{font-weight:600;color:var(--muted);transition:color .25s}
.sys-val{font-family:var(--mono);font-weight:700;text-align:right;word-break:break-word;overflow-wrap:anywhere}
.sys-val.big{color:var(--big)}
.sys-val.small{color:var(--small)}

.dots{display:inline-flex;gap:3px}
.dots span{width:4px;height:4px;border-radius:50%;background:var(--accent-l);animation:dot 1.3s ease-in-out infinite}
.dots span:nth-child(2){animation-delay:.2s}
.dots span:nth-child(3){animation-delay:.4s}

.tbl td{

.tbl th:nth-child(2),.tbl td:nth-child(2){width:20%;font-family:var(--mono);font-size:11px}
.tbl th:nth-child(3),.tbl td:nth-child(3){width:9%;font-family:var(--mono);font-weight:800;font-size:13px}

  .tag{font-size:8.5px;min-width:36px;padding:2px 5px}

@media(max-width:380px){
  .brand-title{font-size:12px}

  .premium{font-size:8px;padding:1px 3px}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function classifyBS(n){
  if(n==null)return null;
  var x=parseInt(n,10);
  if(isNaN(x))return null;
  return x>=5?'BIG':'SMALL';
}
function periodKey(r){return String(r.issueNumber!=null?r.issueNumber:(r.period!=null?r.period:''))}

function predict(hist){
  if(!hist||hist.length<2)return null;
  var recent=hist.slice(0,Math.min(3,hist.length));
  var b=0,s=0;
  recent.forEach(function(r){
    var bs=classifyBS(r.number);
    if(bs==='BIG')b++;else if(bs==='SMALL')s++;
  });
  if(b>s)return'BIG';
  if(s>b)return'SMALL';
  return classifyBS(recent[0].number);
}
function calcRate(hist){
  if(!hist||hist.length<5)return null;
  var ok=0,tot=0;
  for(var i=0;i<3&&i+4<hist.length;i++){
    var p=predict(hist.slice(i+1));
    var a=classifyBS(hist[i].number);
    if(p&&a){if(p===a)ok++;tot++;}
  }
  if(tot===0)return null;
  var r=ok/tot*100;
  return r<33?'low':(r<=66?'medium':'high');
}

    }
    predDb=predApp.database();return true;
  }catch(e){return false}
}
function savePred(period,pred,rate){
  if(!period||!pred||pred==='-')return;
  if(!predDb&&!initPredFB())return;
  var np=String(period).trim(),npr=String(pred).toUpperCase(),nr=rate?String(rate):'-';
  var sig=np+'_'+npr+'_'+nr;
  if(sig===lastPredSig)return;
  var payload={
    id:CHANNEL_KEY+'_'+Date.now(),
    channelKey:CHANNEL_KEY,channelName:'BigWin 30 Free',
    period:np,predictionType:npr,predictionValue:npr,
    rate:nr,timestamp:Date.now(),source:'CK30BIGWIN1_FREE',strategy:STRATEGY
  };
  predDb.ref('predictions').child(CHANNEL_KEY).set(payload)
    .then(function(){lastPredSig=sig;})
    .catch(function(e){console.error('Pred push fail:',e)});
}

function setPredUI(period,pred,rate){
  var pEl=document.getElementById('predPeriod');
  var rEl=document.getElementById('predResult');
  var rtEl=document.getElementById('predRate');
  if(pEl)pEl.textContent=period||'—';
  if(rEl){
    var p=pred?String(pred).toUpperCase():'—';
    rEl.textContent=p;
    rEl.className='pred-val';
    if(p==='BIG')rEl.classList.add('big');
    else if(p==='SMALL')rEl.classList.add('small');
  }
  if(rtEl){
    var r=rate?String(rate).toLowerCase():null;
    rtEl.textContent=rate?t(r):'—';
    rtEl.className='pred-val';
    if(r)rtEl.classList.add(r);
  }
}
function renderSys(results){
  var el=document.getElementById('sysContent');
  if(!el)return;
  if(!results||results.length===0){
    el.innerHTML='<div class="sys-row"><span class="sys-label">'+t('noData')+'</span><span class="sys-val">—</span></div>';
    return;
  }
  var np=predict(results);
  var rate=calcRate(results);
  var last3=results.slice(0,Math.min(3,results.length));
  var pattern=last3.map(function(r){return classifyBS(r.number)}).filter(Boolean).join(' → ');
  var npCls=np==='BIG'?'big':(np==='SMALL'?'small':'');
  var html='<div class="sys-row"><span class="sys-label">'+t('last3')+'</span><span class="sys-val">'+(pattern||'—')+'</span></div>';
  html+='<div class="sys-row"><span class="sys-label">'+t('nextPred')+'</span><span class="sys-val '+npCls+'">'+(np||'—')+'</span></div>';
  html+='<div class="sys-row"><span class="sys-label">'+t('accRate')+'</span><span class="sys-val">'+(rate?t(rate):'—')+'</span></div>';
  el.innerHTML=html;
}
function scheduleSys(results){
  var el=document.getElementById('sysContent');
  var latest=results&&results[0];
  var key=latest?String(latest.issueNumber!=null?latest.issueNumber:latest.period||''):'';
  if(sysTimer){clearTimeout(sysTimer);sysTimer=null;}
  if(!results||results.length===0||!el){renderSys([]);lastSysKey=null;return;}
  if(key&&key!==lastSysKey){
    lastSysKey=key;
    el.innerHTML='<div class="sys-loading">'+t('analysis')+'<span class="dots"><span></span><span></span><span></span></span></div>';
    sysTimer=setTimeout(function(){sysTimer=null;renderSys(results)},400);
  }else{
    renderSys(results);
  }
}

function updateStats(results){
  if(!results||results.length===0){
    scheduleSys([]);setPredUI('—','—','—');return;
  }
  scheduleSys(results);
  var np=predict(results);
  var latest=results[0];
  if(np&&latest&&latest.issueNumber!=null){
    var nextPeriod='—';
    try{
      var nx=BigInt(String(latest.issueNumber))+1n;
      var s=nx.toString();
      nextPeriod=s.length>5?s.slice(-5):s;
    }catch(e){nextPeriod='—';}
    var rate=calcRate(results);
    setPredUI(nextPeriod,np,rate);
    savePred(nextPeriod,np,rate);
  }else{
    setPredUI('—','—','—');
  }
}

function renderTable(full,hist){
  var c=document.getElementById('historyContainer');
  if(!c)return;
  if(!full||full.length===0){
    c.innerHTML='<div class="empty">'
      +'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">'
      +'<path d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/>'
      +'</svg>'
      +'<p class="empty-title">'+t('noData')+'</p>'
      +'<p class="empty-hint">'+t('noDataHint')+'</p></div>';
    updateStats([]);displayed=[];lastSeenKey=null;return;
  }
  updateStats(full);
  var show=hist||[];
  if(show.length===0){
    c.innerHTML='<div class="empty"><p class="empty-title">'+t('noDataHint')+'</p></div>';
    return;
  }
  var h='<div class="history"><table class="tbl"><thead><tr>'
    +'<th>'+t('cIdx')+'</th>'
    +'<th>'+t('cPeriod')+'</th>'
    +'<th>'+t('cNum')+'</th>'
    +'<th>'+t('cBS')+'</th>'
    +'<th>'+t('cPrem')+'</th>'
    +'<th>'+t('cRes')+'</th>'
    +'</tr></thead><tbody>';

  show.forEach(function(r,i){
    var bs=classifyBS(r.number);
    var bsCls=bs==='BIG'?'big':(bs==='SMALL'?'small':'');
    var bsLbl=bs==='BIG'?t('big'):(bs==='SMALL'?t('small'):'—');
    var prem=r.premium||'—';
    var pnum=r.issueNumber!=null?String(r.issueNumber):'—';
    if(pnum!=='—'&&pnum.length>5)pnum=pnum.slice(-5);

    var idx=full.findIndex(function(x){return periodKey(x)===periodKey(r)});
    var histFor=idx>=0?full.slice(idx+1):[];
    var pv=predict(histFor);

    var resHtml='<span class="tag wait">'+t('wait')+'</span>';
    if(pv&&bs){
      if(pv===bs)resHtml='<span class="tag win">'+t('win')+'</span>';
      else resHtml='<span class="tag lose">'+t('lose')+'</span>';
    }else if(histFor.length<2){
      resHtml='<span class="tag wait">—</span>';
    }else{
      resHtml='<span class="tag wait">—</span>';
    }

    h+='<tr>'
      +'<td>'+(i+1)+'</td>'
      +'<td>'+pnum+'</td>'
      +'<td>'+(r.number!=null?r.number:'—')+'</td>'
      +'<td><span class="bs-txt '+bsCls+'">'+bsLbl+'</span></td>'
      +'<td><span class="premium">'+prem+'</span></td>'
      +'<td>'+resHtml+'</td>'
      +'</tr>';
  });
  h+='</tbody></table></div>';
  c.innerHTML=h;
}

function renderLastUpdate(ts){
  lastUpdateTs=ts;
  var el=document.getElementById('lastUpdate');
  if(!el)return;
  if(!ts){el.style.display='none';return;}
  var d=new Date(ts);
  el.textContent=t('lastUpdate')+': '+d.toLocaleString(currentLang==='mm'?'my-MM':'en-US');
  el.style.display='block';
}

function processData(data){
  var list=(data&&data.list&&Array.isArray(data.list))?data.list:[];
  if(list.length===0){renderTable([],[]);return;}
  var latest=list[0];
  var key=periodKey(latest);
  if(!key){renderTable(list,displayed);return;}
  if(lastSeenKey===null){
    lastSeenKey=key;displayed=[latest];
  }else if(key!==lastSeenKey){
    displayed=[latest].concat(displayed);lastSeenKey=key;
  }
  if(displayed.length>50)displayed=displayed.slice(0,50);
  renderTable(list,displayed);
}

function connect(){
  if(!db&&!initFB())return;
  try{
    if(listener)db.ref(PATH).off('value',listener);
    listener=db.ref(PATH).on('value',function(snap){
      var data=snap.val();
      if(data&&data.list&&Array.isArray(data.list)){
        currentResults=data.list;
        processData(data);
        renderLastUpdate(data.publishedAt||Date.now());
      }else{
        renderTable([]);
      }
    },function(err){
      console.error('Firebase read:',err);
    });
  }catch(e){console.error('Connect:',e)}
}

document.addEventListener('DOMContentLoaded',function(){
  setupSync();
  if(initFB())setTimeout(connect,300);
});

window.addEventListener('beforeunload',function(){
  if(listener&&db){try{db.ref(PATH).off('value',listener)}catch(e){}}
});

})();
</script>
