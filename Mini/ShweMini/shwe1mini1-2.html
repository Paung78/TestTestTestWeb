<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Shwe • WinGo 1 Min V1.2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Padauk:wght@400;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --font-sans: 'Inter', 'Padauk', system-ui, -apple-system, sans-serif;
  --bg-page: #fff8f0;
  --bg-card: #ffffff;
  --bg-soft: #ffe8d5;
  --text: #1a0d00;
  --text-muted: #6b5545;
  --text-subtle: #a89080;
  --border: #ffd9b8;
  --border-soft: #ffe8d5;
  --accent: #fb923c;
  --accent-2: #ea580c;
  --accent-soft: rgba(251,146,60,0.12);
  --accent-glow: rgba(251,146,60,0.3);
  --gold: #f59e0b;
  --gold-2: #d97706;
  --gold-bright: #fbbf24;
  --gold-soft: rgba(245,158,11,0.14);
  --green: #059669;
  --green-soft: rgba(5,150,105,0.14);
  --red: #ef4444;
  --red-soft: rgba(239,68,68,0.14);
  --shadow-sm: 0 2px 8px rgba(26,13,0,0.06);
  --shadow-md: 0 8px 24px rgba(26,13,0,0.08);
  --spring: cubic-bezier(0.34,1.56,0.64,1);
  --ease: cubic-bezier(0.32,0.72,0,1);
}

body.dark {
  --bg-page: #140800;
  --bg-card: #241000;
  --bg-soft: #361800;
  --text: #faece0;
  --text-muted: #c2a890;
  --text-subtle: #856a50;
  --border: #391c00;
  --border-soft: #361800;
  --accent: #fdba74;
  --accent-2: #fb923c;
  --accent-soft: rgba(253,186,116,0.16);
  --accent-glow: rgba(253,186,116,0.4);
  --gold: #fbbf24;
  --gold-2: #f59e0b;
  --gold-bright: #fcd34d;
  --gold-soft: rgba(251,191,36,0.16);
  --green: #34d399;
  --green-soft: rgba(52,211,153,0.16);
  --red: #f87171;
  --red-soft: rgba(248,113,113,0.16);
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.4);
  --shadow-md: 0 8px 24px rgba(0,0,0,0.5);
}

html, body {
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  background: var(--bg-page);
  color: var(--text);
  transition: background-color 0.35s ease, color 0.35s ease;
}

body {
  font-family: var(--font-sans);
  min-height: 100vh;
  padding: 14px;
  padding-top: calc(14px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  overflow-x: hidden;
}

body.lang-mm { font-family: 'Padauk', 'Inter', sans-serif; }

.app {
  max-width: 640px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.app-header {
  display: flex;
  flex-direction: column;
  gap: 3px;
  padding: 4px;
  animation: fadeDown 0.4s var(--spring) both;
}
.header-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 17px;
  font-weight: 900;
  letter-spacing: -0.02em;
  color: var(--text);
  line-height: 1.2;
  flex-wrap: wrap;
}
.version-badge {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  font-size: 9.5px;
  font-weight: 800;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--accent-2);
  background: var(--accent-soft);
  border-radius: 999px;
  flex-shrink: 0;
}
.header-sub {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 700;
  color: var(--text-muted);
}
.pulse-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--text-subtle);
  position: relative;
  flex-shrink: 0;
}
.pulse-dot.live { background: var(--green); }
.pulse-dot.error { background: var(--red); }
.pulse-dot.connecting { background: var(--gold); }
.pulse-dot.live::after,
.pulse-dot.error::after {
  content: '';
  position: absolute;
  inset: -3px;
  border-radius: 50%;
  border: 1.5px solid currentColor;
  opacity: 0;
  animation: pulseRing 1.8s ease-out infinite;
}
.pulse-dot.live::after { color: var(--green); }
.pulse-dot.error::after { color: var(--red); }
@keyframes pulseRing {
  0% { opacity: 0.5; transform: scale(0.9); }
  100% { opacity: 0; transform: scale(2); }
}

.cd-banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  background: var(--bg-card);
  border: 1.5px solid var(--accent-soft);
  border-radius: 14px;
  box-shadow: var(--shadow-sm);
  animation: fadeUp 0.5s var(--spring) 60ms both;
  transition: background-color 0.35s, border-color 0.35s;
}
.cd-label-wrap { display: flex; align-items: center; gap: 8px; }
.cd-icon {
  width: 28px; height: 28px;
  border-radius: 8px;
  background: var(--accent-soft);
  color: var(--accent-2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 900;
}
.cd-label {
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
}
.cd-value {
  font-family: 'SF Mono', ui-monospace, monospace;
  font-size: 20px;
  font-weight: 900;
  color: var(--accent-2);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.02em;
  transition: color 0.2s;
}
.cd-value.urgent { color: var(--red); }

.pred-hero {
  position: relative;
  background: var(--bg-card);
  border: 1.5px solid var(--border);
  border-radius: 20px;
  padding: 18px;
  box-shadow: var(--shadow-sm);
  transition: background-color 0.35s, border-color 0.35s;
  overflow: hidden;
  animation: fadeUp 0.5s var(--spring) 120ms both;
}
.pred-hero.ready.big { border-color: rgba(245,158,11,0.4); }
.pred-hero.ready.small { border-color: rgba(251,146,60,0.4); }
body.dark .pred-hero.ready.big { border-color: rgba(251,191,36,0.3); }
body.dark .pred-hero.ready.small { border-color: rgba(253,186,116,0.3); }

.hero-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 14px;
}
.hero-label {
  font-size: 10.5px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 7px;
}
.hero-label::before {
  content: '';
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 6px var(--accent-glow);
}
.hero-period {
  font-family: 'SF Mono', ui-monospace, monospace;
  font-size: 11px;
  font-weight: 800;
  padding: 4px 10px;
  background: var(--bg-soft);
  border-radius: 7px;
  color: var(--text);
  transition: background 0.3s;
}

.analyzing-state {
  display: none;
  flex-direction: column;
  gap: 14px;
  padding: 8px 0 6px;
}
.analyzing-state.show { display: flex; }

.analyzing-track {
  position: relative;
  height: 2px;
  background: var(--border);
  border-radius: 1px;
  overflow: hidden;
}
.analyzing-beam {
  position: absolute;
  top: 0; left: 0;
  height: 100%;
  width: 40%;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  border-radius: 1px;
  animation: beamSlide 1.4s ease-in-out infinite;
}
@keyframes beamSlide {
  0% { left: -40%; }
  100% { left: 100%; }
}

.analyzing-label {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-muted);
  text-align: center;
  min-height: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 2px;
  letter-spacing: 0.01em;
}
.analyzing-label.swap { animation: labelSwap 0.35s ease; }
@keyframes labelSwap {
  0% { opacity: 0; transform: translateY(4px); }
  100% { opacity: 1; transform: translateY(0); }
}
.analyzing-label .dots {
  display: inline-flex;
  gap: 3px;
  margin-left: 3px;
}
.analyzing-label .dots span {
  width: 4px; height: 4px;
  border-radius: 50%;
  background: var(--accent);
  animation: dotBounce 1.2s ease-in-out infinite;
}
.analyzing-label .dots span:nth-child(2) { animation-delay: 0.15s; }
.analyzing-label .dots span:nth-child(3) { animation-delay: 0.3s; }
@keyframes dotBounce {
  0%, 80%, 100% { transform: translateY(0); opacity: 0.35; }
  40% { transform: translateY(-4px); opacity: 1; }
}

.analyzing-progress {
  height: 3px;
  background: var(--bg-soft);
  border-radius: 2px;
  overflow: hidden;
}
.analyzing-progress-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  border-radius: 2px;
  transition: width 0.45s var(--ease);
}

.result-state {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  padding: 10px 0 6px;
}
.result-state.show {
  display: flex;
  animation: resultIn 0.5s var(--spring) both;
}
@keyframes resultIn {
  0% { opacity: 0; transform: scale(0.94); }
  100% { opacity: 1; transform: scale(1); }
}

.result-value {
  font-size: 42px;
  font-weight: 900;
  letter-spacing: 0.14em;
  line-height: 1;
  padding: 2px 0;
  text-transform: uppercase;
  transition: color 0.2s;
}
.pred-hero.big .result-value { color: var(--gold-2); }
.pred-hero.small .result-value { color: var(--accent-2); }
body.dark .pred-hero.big .result-value { color: var(--gold-bright); }

.result-confidence {
  display: flex;
  align-items: center;
  gap: 9px;
  width: 100%;
  max-width: 200px;
  padding: 6px 10px;
  background: var(--bg-soft);
  border-radius: 8px;
}
.conf-label {
  font-size: 9px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-subtle);
  flex-shrink: 0;
}
.conf-track {
  flex: 1;
  height: 3px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}
.conf-fill {
  height: 100%;
  border-radius: 2px;
  width: 0%;
  transition: width 0.7s var(--ease), background 0.3s;
}
.conf-fill.low { background: var(--red); }
.conf-fill.medium { background: var(--gold); }
.conf-fill.high { background: var(--green); }
.conf-text {
  font-size: 9px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  flex-shrink: 0;
}
.conf-text.low { color: var(--red); }
.conf-text.medium { color: var(--gold-2); }
.conf-text.high { color: var(--green); }
body.dark .conf-text.medium { color: var(--gold-bright); }

.stats-strip {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  animation: fadeUp 0.5s var(--spring) 180ms both;
}
.stat-pill {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 10px 12px;
  background: var(--bg-card);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  transition: background-color 0.3s, border-color 0.3s;
}
.stat-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.stat-pill.big .stat-dot { background: var(--gold); }
.stat-pill.small .stat-dot { background: var(--accent); }
.stat-pill.total .stat-dot { background: var(--text-subtle); }
.stat-meta { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.stat-key {
  font-size: 8.5px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-subtle);
}
.stat-val {
  font-size: 15px;
  font-weight: 900;
  color: var(--text);
  font-variant-numeric: tabular-nums;
  line-height: 1.2;
}
.stat-val.flip { animation: flipIn 0.45s var(--spring); }
@keyframes flipIn {
  0% { transform: translateY(-6px); opacity: 0.4; }
  100% { transform: translateY(0); opacity: 1; }
}

.info-strip {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  animation: fadeUp 0.5s var(--spring) 210ms both;
}
.info-item {
  display: flex;
  flex-direction: column;
  gap: 3px;
  padding: 10px 10px 9px;
  background: var(--bg-card);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  min-width: 0;
  transition: background-color 0.3s, border-color 0.3s;
}
.info-key {
  font-size: 8.5px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-subtle);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.info-val {
  font-size: 13.5px;
  font-weight: 900;
  color: var(--text);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.25;
}
.info-val.mono {
  font-family: 'SF Mono', ui-monospace, monospace;
  letter-spacing: 0.01em;
}
.info-val.ok { color: var(--green); }
.info-val.warn { color: var(--gold-2); }
.info-val.bad { color: var(--red); }
body.dark .info-val.warn { color: var(--gold-bright); }

.history-section {
  position: relative;
  animation: fadeUp 0.5s var(--spring) 260ms both;
}
.history-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 4px;
  margin-bottom: 10px;
}
.history-title {
  font-size: 12px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 8px;
}
.history-title::before {
  content: '';
  width: 3px; height: 13px;
  border-radius: 2px;
  background: linear-gradient(180deg, var(--accent), var(--accent-2));
}
.update-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 8px;
  background: var(--green-soft);
  color: var(--green);
  border-radius: 999px;
  font-size: 9px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  opacity: 0;
  transform: scale(0.7);
  transition: opacity 0.3s, transform 0.3s var(--spring);
}
.update-pill.show { opacity: 1; transform: scale(1); }

.history-wrap {
  position: relative;
  background: var(--bg-card);
  border: 1.5px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  transition: background-color 0.35s, border-color 0.35s;
}
.history-wrap.scanning::before {
  content: '';
  position: absolute;
  top: -60px;
  left: 0; right: 0;
  height: 60px;
  background: linear-gradient(180deg, transparent, var(--accent-soft), transparent);
  animation: historyScan 1.3s ease-out;
  pointer-events: none;
  z-index: 5;
}
@keyframes historyScan {
  from { top: -60px; }
  to { top: 100%; }
}

.history-table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
}
.history-table th {
  padding: 10px 8px;
  text-align: left;
  font-size: 9px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-subtle);
  background: var(--bg-soft);
  border-bottom: 1px solid var(--border);
}
.history-table th:first-child { padding-left: 14px; }
.history-table th:last-child { padding-right: 14px; text-align: right; }
.history-table td {
  padding: 11px 8px;
  font-size: 12.5px;
  font-weight: 700;
  color: var(--text);
  border-bottom: 1px solid var(--border-soft);
  vertical-align: middle;
}
.history-table td:first-child { padding-left: 14px; }
.history-table td:last-child { padding-right: 14px; text-align: right; }
.history-table tbody tr:last-child td { border-bottom: none; }
@media (hover: hover) and (pointer: fine) {
  .history-table tbody tr:hover td { background: var(--bg-soft); }
}
.hidx {
  width: 8%;
  color: var(--text-subtle);
  font-size: 10px;
  font-weight: 800;
  font-family: 'SF Mono', ui-monospace, monospace;
}
.hperiod {
  width: 24%;
  font-family: 'SF Mono', ui-monospace, monospace;
  font-size: 11px;
  font-weight: 800;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.hnum { width: 12%; text-align: center; font-weight: 900; font-size: 13px; }
.hbs { width: 18%; text-align: center; }
.hwl { width: 38%; text-align: right; }

.bs-chip {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 9.5px;
  font-weight: 800;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  min-width: 42px;
}
.bs-chip.big { background: var(--gold-soft); color: var(--gold-2); }
body.dark .bs-chip.big { color: var(--gold-bright); }
.bs-chip.small { background: var(--accent-soft); color: var(--accent-2); }

.wl-chip {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 3px 9px;
  border-radius: 6px;
  font-size: 9.5px;
  font-weight: 800;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  min-width: 44px;
}
.wl-chip.win { background: var(--green-soft); color: var(--green); }
.wl-chip.lose { background: var(--red-soft); color: var(--red); }
.wl-chip.wait { background: var(--bg-soft); color: var(--text-subtle); }

.row-new td { animation: rowFlash 0.9s ease; }
@keyframes rowFlash {
  0% { background: var(--accent-soft); }
  100% { background: transparent; }
}

.empty-state { padding: 40px 20px; text-align: center; }
.empty-icon {
  width: 44px; height: 44px;
  margin: 0 auto 12px;
  border-radius: 12px;
  background: var(--bg-soft);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  color: var(--text-subtle);
}
.empty-title {
  font-size: 12.5px;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 3px;
}
.empty-hint {
  font-size: 11px;
  color: var(--text-subtle);
  font-weight: 600;
}

.last-update {
  text-align: center;
  padding: 6px 0 2px;
  font-size: 10px;
  font-weight: 600;
  color: var(--text-subtle);
  letter-spacing: 0.02em;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeDown {
  from { opacity: 0; transform: translateY(-8px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 420px) {
  body { padding: 10px; padding-top: calc(10px + env(safe-area-inset-top, 0px)); }
  .app { gap: 10px; }
  .header-title { font-size: 16px; }
  .result-value { font-size: 36px; }
  .cd-value { font-size: 18px; }
  .stat-pill { padding: 9px 10px; gap: 7px; }
  .stat-val { font-size: 14px; }
  .info-item { padding: 9px 8px 8px; }
  .info-val { font-size: 12.5px; }
  .info-key { font-size: 8px; }
  .history-table th, .history-table td { padding: 9px 5px; font-size: 11px; }
  .history-table th:first-child { padding-left: 10px; }
  .history-table td:first-child { padding-left: 10px; }
  .history-table th:last-child { padding-right: 10px; }
  .history-table td:last-child { padding-right: 10px; }
  .hperiod { font-size: 10px; }
  .pred-hero { padding: 16px 14px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>
<body>

<div class="app">
  <header class="app-header">
    <h1 class="header-title">
      <span data-en="Shwe • WinGo 1 Min" data-mm="Shwe • WinGo 1 မိနစ်">Shwe • WinGo 1 Min</span>
      <span class="version-badge">V1.2</span>
    </h1>
    <div class="header-sub">
      <span class="pulse-dot" id="pulseDot"></span>
      <span id="connectionText" data-en="Connecting..." data-mm="ချိတ်ဆက်နေသည်...">Connecting...</span>

function classifyBS(n) {
  var num = parseInt(n, 10);
  if (isNaN(num)) return null;

}
function periodKey(r) {
  return String(r.issueNumber != null ? r.issueNumber : (r.period != null ? r.period : ''));

function displayPeriod(p) {
  if (!p) return '—';

function getNextPeriod(issue) {
  var s = String(issue == null ? '' : issue).replace(/\D/g, '');
  if (!s) return '—';
  try {
    var n = BigInt(s) + 1n;
    var ns = n.toString();
    if (s.length > ns.length) ns = ns.padStart(s.length, '0');
    return ns.length > 8 ? ns.slice(-6) : ns;
  } catch(e) { return '—'; }
}
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
  });
}

/* ===== PREDICTION LOGIC (6Win/BigWin: Trend Follow + Weighted Vote) ===== */
function calculatePrediction(history) {
  if (!history || history.length < 3) return null;
  var last3 = history.slice(0, 3).map(function(r){ return classifyBS(r.number); }).filter(Boolean);
  if (last3.length === 3 && last3[0] === last3[1] && last3[1] === last3[2]) {
    return last3[0];
  }
  var w = Math.min(8, history.length);
  var recent = history.slice(0, w);
  var big = 0, small = 0;
  for (var i = 0; i < recent.length; i++) {
    var bs = classifyBS(recent[i].number);
    var weight = recent.length - i;
    if (bs === 'BIG') big += weight;
    else if (bs === 'SMALL') small += weight;
  }
  if (big === 0 && small === 0) return null;
  return big > small ? 'BIG' : 'SMALL';
}

function calculateAccuracyPct(history) {
  if (!history || history.length < 6) return null;
  var correct = 0, total = 0;
  for (var i = 0; i < 3 && i + 5 < history.length; i++) {
    var pred = calculatePrediction(history.slice(i + 1));
    var actual = classifyBS(history[i].number);
    if (pred && actual) {
      if (pred === actual) correct++;
      total++;
    }
  }
  if (total === 0) return null;
  return Math.round((correct / total) * 100);
}

function calculateRateLabel(history) {
  var pct = calculateAccuracyPct(history);
  if (pct === null) return null;
  return pct < 33 ? 'Low' : pct <= 66 ? 'Medium' : 'High';
}

function predictFromHistory(results) {
  var value = calculatePrediction(results);
  if (!value) return null;
  var rateLabel = calculateRateLabel(results);
  var confidence = 'medium';
  if (rateLabel === 'Low') confidence = 'low';
  else if (rateLabel === 'High') confidence = 'high';
  return { value: value, confidence: confidence };
}

function revealResult(pred) {
  var hero = document.getElementById('predHero');
  var resultState = document.getElementById('resultState');
  var valueEl = document.getElementById('resultValue');
  var confFill = document.getElementById('confFill');
  var confText = document.getElementById('confText');

  if (hero) {
    hero.classList.add('ready');
    hero.classList.toggle('big', pred.value === 'BIG');
    hero.classList.toggle('small', pred.value === 'SMALL');
  }
  var pct = pred.confidence === 'high' ? 85 : pred.confidence === 'medium' ? 60 : 35;
  if (confFill) {
    confFill.className = 'conf-fill ' + pred.confidence;
    confFill.style.width = pct + '%';
  }
  if (confText) {
    confText.className = 'conf-text ' + pred.confidence;

function renderPrediction(forceAnalyze) {
  var periodEl = document.getElementById('heroPeriod');
  var analyzingState = document.getElementById('analyzingState');
  var resultState = document.getElementById('resultState');
  if (!currentResults.length) {
    if (analyzingState) analyzingState.classList.remove('show');
    if (resultState) resultState.classList.remove('show');
    if (periodEl) periodEl.textContent = '—';
    return;
  }
  var latest = currentResults[0];
  var latestKey = periodKey(latest);
  var nextPeriod = getNextPeriod(latest.issueNumber != null ? latest.issueNumber : latest.period);
  var pred = predictFromHistory(currentResults);
  if (periodEl) periodEl.textContent = '#' + nextPeriod;
  if (!pred) {
    if (analyzingState) analyzingState.classList.remove('show');
    if (resultState) resultState.classList.remove('show');
    return;
  }
  var needsAnalysis = forceAnalyze || lastAnalyzedKey !== latestKey;
  if (needsAnalysis) {
    lastAnalyzedKey = latestKey;
    runAnalysis(function(){ revealResult(pred); });
  } else {
    revealResult(pred);
  }
}

function renderHistory() {
  var container = document.getElementById('historyContainer');
  if (!container) return;
  if (!displayedHistory.length) {
    container.innerHTML = '<div class="history-wrap"><div class="empty-state">' +
      '<div class="empty-icon">◔</div>' +
      '<div class="empty-title">' + escapeHtml(t('noData')) + '</div>' +
      '<div class="empty-hint">' + escapeHtml(t('waitFeed')) + '</div>' +
      '</div></div>';
    return;
  }
  var html = '<div class="history-wrap"><table class="history-table"><thead><tr>' +
    '<th class="hidx">' + escapeHtml(t('colHash')) + '</th>' +
    '<th class="hperiod">' + escapeHtml(t('colPeriod')) + '</th>' +
    '<th class="hnum">' + escapeHtml(t('colNum')) + '</th>' +
    '<th class="hbs">' + escapeHtml(t('colBS')) + '</th>' +
    '<th class="hwl">' + escapeHtml(t('colResult')) + '</th>' +
    '</tr></thead><tbody>';
  displayedHistory.forEach(function(r, i) {
    var bs = classifyBS(r.number);
    var period = displayPeriod(periodKey(r));
    var num = (r.number != null) ? r.number : '—';
    var idxInFull = currentResults.findIndex(function(x){ return periodKey(x) === periodKey(r); });
    var histBefore = idxInFull >= 0 ? currentResults.slice(idxInFull + 1) : [];
    var pred = calculatePrediction(histBefore);
    var wlClass = 'wait', wlText = '—';
    if (pred && bs) {
      if (pred === bs) { wlClass = 'win'; wlText = t('win'); }
      else { wlClass = 'lose'; wlText = t('lose'); }
    } else if (histBefore.length < 3) {
      wlClass = 'wait'; wlText = '—';
    }
    var rowClass = (i === 0 && displayedHistory.length > 1) ? ' class="row-new"' : '';
    html += '<tr' + rowClass + '>' +
      '<td class="hidx">' + (i + 1) + '</td>' +
      '<td class="hperiod">' + escapeHtml(period) + '</td>' +
      '<td class="hnum">' + escapeHtml(num) + '</td>' +
      '<td class="hbs">' + (bs
        ? '<span class="bs-chip ' + bs.toLowerCase() + '">' + escapeHtml(t(bs === 'BIG' ? 'bigShort' : 'smallShort')) + '</span>'
        : '—') + '</td>' +
      '<td class="hwl"><span class="wl-chip ' + wlClass + '">' + escapeHtml(wlText) + '</span></td>' +
    '</tr>';
  });
  html += '</tbody></table></div>';
  container.innerHTML = html;
}

  try {
    var app;
    try { app = firebase.app('shwe1mini12'); }
    catch (e) { app = firebase.initializeApp(firebaseConfig, 'shwe1mini12'); }
    db = app.database();
    return true;
  } catch (e) {
    console.error('Firebase init error', e);
    setConnection('error');
    return false;
  }
}

function processData(data) {
  var list = (data && data.list && Array.isArray(data.list)) ? data.list : [];
  currentResults = list;
  if (!list.length) {
    displayedHistory = [];
    lastSeenKey = null;
    renderStats();
    renderInfoStrip();
    renderHistory();
    renderPrediction(false);
    renderLastUpdate(null);
    return;
  }
  var latest = list[0];
  var latestKey = periodKey(latest);
  var isNew = false;
  if (lastSeenKey === null) {
    displayedHistory = [latest];
    lastSeenKey = latestKey;
    startCD();
  } else if (latestKey !== lastSeenKey) {
    displayedHistory = [latest].concat(displayedHistory);
    lastSeenKey = latestKey;
    isNew = true;
    startCD();
  }
  if (displayedHistory.length > 40) displayedHistory = displayedHistory.slice(0, 40);
  renderStats();
  renderInfoStrip();
  renderHistory();
  renderPrediction(isNew || lastAnalyzedKey === null);
  renderLastUpdate(data && data.publishedAt ? data.publishedAt : Date.now());
  if (isNew) flashUpdatePill();
}

function connectFirebase() {
  if (!db && !initFirebase()) return;
  setConnection('connecting');
  try {
    if (listener) db.ref(FIREBASE_PATH).off('value', listener);
    listener = db.ref(FIREBASE_PATH).on('value', function(snap){
      var data = snap.val();
      if (data && data.list && Array.isArray(data.list)) {
        processData(data);
        setConnection('live');
      } else {
        processData(null);
        setConnection('connecting');
      }
    }, function(err){
      console.error('Firebase read error', err);
      setConnection('error');
    });
  } catch (e) {
    setConnection('error');
  }
}

function applyStoredState() {
  applyTheme(localStorage.getItem('appTheme') || 'light');
  applyLanguage(localStorage.getItem('appLang') || 'en');
}
window.addEventListener('storage', function(e){
  if (e.key === 'appTheme' && e.newValue) applyTheme(e.newValue);
  if (e.key === 'appLang' && e.newValue) applyLanguage(e.newValue);
});
window.addEventListener('message', function(e){
  if (!e.data || e.data.type !== 'app-sync') return;
  if (e.data.theme) applyTheme(e.data.theme);
  if (e.data.language) applyLanguage(e.data.language);
});

function init() {
  applyStoredState();
  if (initFirebase()) {
    setTimeout(connectFirebase, 250);
  } else {
    setConnection('error');
  }
}
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
window.addEventListener('beforeunload', function(){
  if (listener && db) { try { db.ref(FIREBASE_PATH).off('value', listener); } catch(e){} }
  clearAnalysisTimers();
  if (cdTimer) clearInterval(cdTimer);
});
})();
</script>
