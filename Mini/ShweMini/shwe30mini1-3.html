<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --font-sans: 'Inter', 'Padauk', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', 'Courier New', monospace;

  /* Shwe Orange Theme */
  --bg-page: #f8fafc;
  --bg-card: #ffffff;
  --text-dark: #0f172a;
  --text-muted: #64748b;
  --text-light: #cbd5e1;
  
  --accent: #ea580c; 
  --accent-hover: #c2410c;
  --accent-light: #fb923c;
  --accent-glow: rgba(234, 88, 12, 0.2);
  
  --border: #e2e8f0;
  --border-light: #f1f5f9;
  
  --terminal-bg: #0f172a;
  --terminal-text: #fb923c; 

  /* Specific Colors */
  --color-big: #ca8a04;
  --color-small: #0284c7;
  --color-win: #16a34a;
  --color-lose: #dc2626;
  --color-low: #dc2626;
  --color-med: #ea580c;
  --color-high: #16a34a;
  --bg-big: rgba(202, 138, 4, 0.15);
  --bg-small: rgba(2, 132, 199, 0.15);

  --spring: cubic-bezier(0.34,1.56,0.64,1);
  --ease: cubic-bezier(0.32,0.72,0,1);
}

body.dark {
  --bg-page: #0f172a;
  --bg-card: #1e293b;
  --text-dark: #f1f5f9;
  --text-muted: #94a3b8;
  --text-light: #334155;
  
  --accent: #fb923c;
  --accent-hover: #ea580c;
  --accent-light: #fdba74;
  --accent-glow: rgba(251, 146, 60, 0.25);
  
  --border: #334155;
  --border-light: #1e293b;
  
  --terminal-bg: #020617;
  --terminal-text: #fb923c;

  --color-big: #fde047;
  --color-small: #38bdf8;
  --color-win: #4ade80;
  --color-lose: #f87171;
  --color-low: #f87171;
  --color-med: #fb923c;
  --color-high: #4ade80;
  --bg-big: rgba(253, 224, 71, 0.15);
  --bg-small: rgba(56, 189, 248, 0.15);
}

html, body { -webkit-font-smoothing: antialiased; background: var(--bg-page); color: var(--text-dark); transition: background-color 0.35s ease, color 0.35s ease; }
body { font-family: var(--font-sans); min-height: 100vh; padding: 14px; padding-top: calc(14px + env(safe-area-inset-top, 0px)); padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: center; }
body.lang-mm { font-family: 'Padauk', 'Inter', sans-serif; }
.app { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 16px; }

.app-header { display: flex; align-items: flex-end; justify-content: space-between; padding: 0 4px 10px; border-bottom: 1px solid var(--border); animation: fadeDown 0.5s var(--ease) both; }
.header-left { display: flex; flex-direction: column; gap: 4px; }
.header-title { font-size: 16px; font-weight: 800; color: var(--text-dark); line-height: 1.2; display: flex; align-items: center; gap: 8px; }
.version-badge { font-family: var(--font-mono); font-size: 9.5px; font-weight: 700; padding: 2px 8px; background: var(--accent); color: #fff; border-radius: 999px; letter-spacing: 0.05em; text-transform: uppercase; }
.header-sub { font-size: 11px; font-weight: 600; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
.pulse-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); transition: background 0.3s; }
.pulse-dot.live { background: var(--accent); box-shadow: 0 0 8px var(--accent-glow); }
.pulse-dot.error { background: var(--color-lose); }

.cd-banner { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: var(--bg-card); border: 1.5px solid var(--border); border-radius: 12px; animation: fadeUp 0.5s var(--ease) 80ms both; }
.cd-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }

.terminal-box { background: var(--terminal-bg); border: 1.5px solid var(--border); border-radius: 14px; padding: 18px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); position: relative; overflow: hidden; animation: fadeUp 0.5s var(--ease) 160ms both; }

.terminal-line .prompt { color: var(--accent-light); font-weight: 700; }

.result-box { background: var(--bg-card); border: 1.5px solid var(--border); border-radius: 14px; padding: 18px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); position: relative; overflow: hidden; animation: fadeUp 0.5s var(--ease) 200ms both; min-height: 140px; display: flex; flex-direction: column; }
.result-box .hero-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.result-box .hero-label { font-family: var(--font-mono); font-size: 10px; font-weight: 700; color: var(--accent); letter-spacing: 0.08em; text-transform: uppercase; }

.conf-label { font-family: var(--font-mono); font-size: 9px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
.conf-track { flex: 1; height: 3px; background: var(--border); border-radius: 2px; }
.conf-fill { height: 100%; width: 0%; background: var(--accent); border-radius: 2px; transition: width 0.8s var(--ease); }
.conf-fill.low { background: var(--color-low); }
.conf-fill.medium { background: var(--color-med); }
.conf-fill.high { background: var(--color-high); }
.conf-text { font-family: var(--font-mono); font-size: 9px; font-weight: 700; color: var(--accent); text-transform: uppercase; }
.conf-text.low { color: var(--color-low); }
.conf-text.medium { color: var(--color-med); }
.conf-text.high { color: var(--color-high); }

.stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; animation: fadeUp 0.5s var(--ease) 240ms both; }
.stat-box { background: var(--bg-card); border: 1.5px solid var(--border); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 4px; position: relative; overflow: hidden; }
.stat-box::before { content: ''; position: absolute; top: 0; left: 0; width: 3px; height: 100%; background: var(--accent); opacity: 0.6; }
.stat-label { font-size: 9px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
.stat-val { font-family: var(--font-mono); font-size: 13px; font-weight: 700; color: var(--text-dark); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat-val.ok { color: var(--accent); }
.stat-val.bad { color: var(--color-lose); }

.history-section { animation: fadeUp 0.5s var(--ease) 320ms both; }
.history-head { display: flex; align-items: center; justify-content: space-between; padding-bottom: 10px; border-bottom: 1px solid var(--border); margin-bottom: 10px; }
.history-title { font-size: 12px; font-weight: 800; color: var(--text-dark); text-transform: uppercase; letter-spacing: 0.05em; }
.history-badge { font-family: var(--font-mono); font-size: 9px; font-weight: 700; color: var(--accent); padding: 2px 8px; border: 1px solid var(--accent); border-radius: 999px; opacity: 0; transition: opacity 0.3s; }
.history-badge.show { opacity: 1; }

.history-wrap { background: var(--bg-card); border: 1.5px solid var(--border); border-radius: 12px; overflow: hidden; overflow-x: auto; -webkit-overflow-scrolling: touch; }
.history-table { width: 100%; border-collapse: collapse; min-width: 400px; }
.history-table th { font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); background: var(--border-light); }
.history-table th:last-child { text-align: right; }
.history-table td { padding: 10px 12px; border-bottom: 1px solid var(--border-light); font-size: 11.5px; font-weight: 600; color: var(--text-dark); }
.history-table tr:last-child td { border-bottom: none; }
.history-table td.hid { color: var(--text-muted); font-family: var(--font-mono); font-size: 10px; width: 30px; }
.history-table td.hper { font-family: var(--font-mono); font-weight: 700; }
.history-table td.hnum { text-align: center; font-weight: 700; }
.history-table td.hbs { text-align: center; }
.history-table td.hprem { color: var(--text-dark); font-family: var(--font-mono); font-size: 10px; }
.history-table td.hres { text-align: right; font-weight: 700; font-size: 10px; }

.badge-bs { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 9px; font-weight: 800; text-transform: uppercase; min-width: 40px; text-align: center; }
.badge-bs.big { background: var(--bg-big); color: var(--color-big); }
.badge-bs.small { background: var(--bg-small); color: var(--color-small); }
.badge-res.win { color: var(--color-win); }
.badge-res.lose { color: var(--color-lose); }

.row-new td { animation: rowIn 0.5s var(--ease) both; }
@keyframes rowIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

.last-update { text-align: center; font-size: 10px; color: var(--text-muted); margin-top: 12px; font-family: var(--font-mono); }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

@media (max-width: 380px) {
  .header-title { font-size: 15px; }
  .result-value { font-size: 32px; }
  .stat-val { font-size: 12px; }
  .terminal-line { font-size: 10.5px; }
}
</style>

var FIREBASE_PATH = "shwewingo30/default";

var T = {

};
function t(k) { return (T[currentLang] && T[currentLang][k]) || k; }

function classifyBS(n) { var num = parseInt(n, 10); if (isNaN(num)) return null; return num >= 5 ? 'BIG' : 'SMALL'; }

function calculatePrediction(history) {
  if (!history || history.length < 2) return null;
  var bsList = history.map(function(r){ return classifyBS(r.number); }).filter(Boolean);
  if (bsList.length < 2) return null;
  if (bsList.length >= 3 && bsList[0] === bsList[2] && bsList[0] !== bsList[1]) return { value: bsList[1], confidence: 'high' };

function calculateAccuracyPct(history) {
  if (!history || history.length < 6) return null;
  var correct = 0, total = 0;
  for (var i = 0; i < 4 && i + 4 < history.length; i++) {

  }
  if (total === 0) return null;

function startCD() { if (cdTimer) clearInterval(cdTimer); cdSec = CD_DURATION; updateCD(); cdTimer = setInterval(function(){ cdSec = Math.max(0, cdSec - 1); updateCD(); if (cdSec <= 0) { clearInterval(cdTimer); cdTimer = null; } }, 1000); }
function updateCD() { var el = document.getElementById('cdValue'); if (!el) return; var m = Math.floor(cdSec / 60), s = cdSec % 60; el.textContent = (m < 10 ? '0'+m : m) + ':' + (s < 10 ? '0'+s : s); el.classList.toggle('urgent', cdSec <= 5 && cdSec > 0); }

function updateTerminalTexts() { var keys = ['t1', 't2', 't3', 't4']; for (var i = 1; i <= currentLine; i++) { var el = document.getElementById('line' + i); if (el) { var txtEl = el.querySelector('.text'); if (txtEl) txtEl.textContent = t(keys[i-1]); } } }
function clearTerminal() { if (typeTimer) clearTimeout(typeTimer); currentLine = 0; ['line1', 'line2', 'line3', 'line4'].forEach(function(id){ var el = document.getElementById(id); if (el) { el.style.display = 'none'; el.querySelector('.text').textContent = ''; } }); document.getElementById('cursor').style.display = 'inline-block'; }
function typeLine(lineIndex, callback) {
  currentLine = lineIndex; var el = document.getElementById('line' + lineIndex); if (!el) { if(callback) callback(); return; }
  el.style.display = 'flex'; var txtEl = el.querySelector('.text'), keys = ['t1', 't2', 't3', 't4'], fullText = t(keys[lineIndex-1]), charIndex = 0; txtEl.textContent = '';
  function typeChar() { if (charIndex < fullText.length) { txtEl.textContent += fullText.charAt(charIndex); charIndex++; typeTimer = setTimeout(typeChar, 20); } else { if (callback) setTimeout(callback, 300); } }
  typeChar();
}

function runAnalysisAnimation(pred, onComplete) {
  clearTerminal(); document.getElementById('resultArea').classList.remove('show');
  typeLine(1, function(){ typeLine(2, function(){ typeLine(3, function(){ typeLine(4, function(){ document.getElementById('cursor').style.display = 'none'; if (onComplete) onComplete(); }); }); }); });
}

function renderPrediction(forceAnalyze) {
  var periodEl = document.getElementById('heroPeriod');
  if (!currentResults.length) { clearTerminal(); document.getElementById('resultArea').classList.remove('show'); if (periodEl) periodEl.textContent = '#---'; return; }
  var latest = currentResults[0], latestKey = periodKey(latest), nextPeriod = getNextPeriod(latest.issueNumber != null ? latest.issueNumber : latest.period), pred = calculatePrediction(currentResults);
  if (periodEl) periodEl.textContent = '#' + nextPeriod;
  if (!pred) { clearTerminal(); document.getElementById('resultArea').classList.remove('show'); return; }
  var needsAnalysis = forceAnalyze || lastAnalyzedKey !== latestKey;
  if (needsAnalysis) { lastAnalyzedKey = latestKey; runAnalysisAnimation(pred, function() { revealResult(pred); }); }
  else { clearTerminal(); currentLine = 4; updateTerminalTexts(); document.getElementById('cursor').style.display = 'none'; revealResult(pred); }
}

function revealResult(pred) {
  var area = document.getElementById('resultArea'), valEl = document.getElementById('resultValue'), confFill = document.getElementById('confFill'), confTxt = document.getElementById('confText');
  area.classList.add('show'); valEl.textContent = t(pred.value.toLowerCase());
  valEl.classList.toggle('is-small', pred.value === 'SMALL');
  var pct = pred.confidence === 'high' ? 85 : pred.confidence === 'medium' ? 55 : 30;
  confFill.style.width = pct + '%';
  confFill.className = 'conf-fill ' + pred.confidence;
  confTxt.className = 'conf-text ' + pred.confidence;
  var confKey = pred.confidence === 'high' ? 'high' : (pred.confidence === 'medium' ? 'med' : 'low');
  confTxt.textContent = t(confKey);
}

function updateResultLabels() { var pred = calculatePrediction(currentResults); if (!pred) return; var confTxt = document.getElementById('confText'); if (confTxt) { var confKey = pred.confidence === 'high' ? 'high' : (pred.confidence === 'medium' ? 'med' : 'low'); confTxt.textContent = t(confKey); } }

function renderStats() {
  var latestEl = document.getElementById('latestPeriodVal'), accEl = document.getElementById('accuracyVal'), rateEl = document.getElementById('rateVal');
  if (!currentResults.length) { latestEl.textContent = '---'; accEl.textContent = '--%'; rateEl.textContent = '--'; return; }
  latestEl.textContent = displayPeriod(periodKey(currentResults[0]));
  var acc = calculateAccuracyPct(currentResults);
  if (acc !== null) { accEl.textContent = acc + '%'; accEl.className = 'stat-val ' + (acc >= 66 ? 'ok' : acc < 40 ? 'bad' : ''); }
  else { accEl.textContent = '--%'; accEl.className = 'stat-val'; }
  var pred = calculatePrediction(currentResults);
  if (pred) { var confKey = pred.confidence === 'high' ? 'high' : (pred.confidence === 'medium' ? 'med' : 'low'); rateEl.textContent = t(confKey); rateEl.className = 'stat-val ' + (pred.confidence === 'high' ? 'ok' : ''); }
  else { rateEl.textContent = '--'; rateEl.className = 'stat-val'; }
}

function renderHistory() {
  var tbody = document.getElementById('historyBody'); if (!tbody) return;
  if (!displayedHistory.length) { tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding: 24px; color: var(--text-muted); font-size:11px;">' + t('conn_ing') + '</td></tr>'; return; }
  var html = '';
  displayedHistory.forEach(function(r, i) {
    var bs = classifyBS(r.number), period = displayPeriod(periodKey(r)), num = (r.number != null) ? r.number : '-', prem = (r.premium || r.hashValue || r.blockHashtag || '-').toString();
    if (prem.length > 8) prem = prem.slice(-8);
    var bsLabel = bs ? t(bs.toLowerCase()) : '-';
    var idxInFull = currentResults.findIndex(function(x){ return periodKey(x) === periodKey(r); });
    var histBefore = idxInFull >= 0 ? currentResults.slice(idxInFull + 1) : [], pred = calculatePrediction(histBefore);
    var resClass = '', resTxt = t('wait');
    if (pred && bs) { if (pred.value === bs) { resClass = 'win'; resTxt = t('win'); } else { resClass = 'lose'; resTxt = t('lose'); } }
    var rowClass = (i === 0 && displayedHistory.length > 1) ? ' class="row-new"' : '';
    html += '<tr' + rowClass + '><td class="hid">' + (i+1) + '</td><td class="hper">' + period + '</td><td class="hnum">' + num + '</td><td class="hbs"><span class="badge-bs ' + (bs ? bs.toLowerCase() : '') + '">' + bsLabel + '</span></td><td class="hprem">' + prem + '</td><td class="hres"><span class="badge-res ' + resClass + '">' + resTxt + '</span></td></tr>';
  });
  tbody.innerHTML = html;
}

function renderLastUpdate(ts) {
  lastUpdateTime = ts; var el = document.getElementById('lastUpdate'); if (!el) return;
  if (!ts) { el.style.display = 'none'; return; }
  var date = new Date(ts); el.textContent = 'Last Sync: ' + date.toLocaleTimeString('en-US'); el.style.display = 'block';
}

function flashBadge() { var b = document.getElementById('historyBadge'); if (!b) return; b.classList.add('show'); setTimeout(function(){ b.classList.remove('show'); }, 2500); }

function initFirebase() { try { var app; try { app = firebase.app('shwe30mini13'); } catch (e) { app = firebase.initializeApp(firebaseConfig, 'shwe30mini13'); } db = app.database(); return true; } catch (e) { console.error(e); setConn('error'); return false; } }

function processData(data) {
  var list = (data && data.list && Array.isArray(data.list)) ? data.list : []; currentResults = list;
  if (!list.length) { displayedHistory = []; lastSeenKey = null; renderStats(); renderHistory(); renderPrediction(false); renderLastUpdate(null); return; }
  var latest = list[0], latestKey = periodKey(latest), isNew = false;
  if (lastSeenKey === null) { displayedHistory = [latest]; lastSeenKey = latestKey; startCD(); }
  else if (latestKey !== lastSeenKey) { displayedHistory = [latest].concat(displayedHistory); lastSeenKey = latestKey; isNew = true; startCD(); }
  if (displayedHistory.length > 20) displayedHistory = displayedHistory.slice(0, 20);
  renderStats(); renderHistory(); renderPrediction(isNew || lastAnalyzedKey === null); renderLastUpdate(data && data.publishedAt ? data.publishedAt : Date.now());
  if (isNew) flashBadge();
}

function connectFirebase() {
  if (!db && !initFirebase()) return; setConn('connecting');
  try {
    if (listener) db.ref(FIREBASE_PATH).off('value', listener);
    listener = db.ref(FIREBASE_PATH).on('value', function(snap){ var data = snap.val(); if (data && data.list && Array.isArray(data.list)) { processData(data); setConn('live'); } else { processData(null); setConn('connecting'); } }, function(err){ console.error(err); setConn('error'); });
  } catch (e) { setConn('error'); }
}

function applyStoredState() { applyTheme(localStorage.getItem('appTheme') || 'light'); applyLanguage(localStorage.getItem('appLang') || 'en'); }
window.addEventListener('storage', function(e){ if (e.key === 'appTheme' && e.newValue) applyTheme(e.newValue); if (e.key === 'appLang' && e.newValue) applyLanguage(e.newValue); });
window.addEventListener('message', function(e){ if (!e.data || e.data.type !== 'app-sync') return; if (e.data.theme) applyTheme(e.data.theme); if (e.data.language) applyLanguage(e.data.language); });

function init() { applyStoredState(); if (initFirebase()) setTimeout(connectFirebase, 250); else setConn('error'); }
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
window.addEventListener('beforeunload', function(){ if (listener && db) { try { db.ref(FIREBASE_PATH).off('value', listener); } catch(e){} } if (cdTimer) clearInterval(cdTimer); if (typeTimer) clearTimeout(typeTimer); });
})();
</script>
</body>
</html>
