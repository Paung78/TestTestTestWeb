<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>SixWin WinGo 30 History</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Padauk:wght@400;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --ck-1: #f87171;
    --ck-2: #dc2626;
    --ck-text: #b91c1c;
    --green: #22c55e;
    --red: #ef4444;
    --violet: #a855f7;
    --yellow: #ca8a04;

    --bg-page: #f8fafc;
    --bg-card: #ffffff;
    --bg-thead: #eef2ff;
    --bg-hover: #f1f5f9;
    --text: #0f172a;
    --text-muted: #64748b;
    --text-subtle: #94a3b8;
    --border: #e2e8f0;
    --border-soft: #f1f5f9;
    --shadow-card: 0 4px 20px rgba(15, 23, 42, 0.05);
  }

  body.dark-mode {
    --bg-page: #0f172a;
    --bg-card: #1e293b;
    --bg-thead: #1a2438;
    --bg-hover: #263449;
    --text: #f1f5f9;
    --text-muted: #94a3b8;
    --text-subtle: #64748b;
    --border: #334155;
    --border-soft: #263449;
    --ck-text: #a5b4fc;
    --yellow: #fbbf24;
    --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.25);
  }

  html, body {
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }

  body {
    font-family: 'Inter', 'Padauk', system-ui, -apple-system, sans-serif;
    background: var(--bg-page);
    color: var(--text);
    min-height: 100vh;
    padding: clamp(10px, 2vw, 18px);
    padding-bottom: calc(clamp(10px, 2vw, 18px) + env(safe-area-inset-bottom, 0px));
    -webkit-text-size-adjust: 100%;
    transition: background-color 0.3s ease, color 0.3s ease;
  }

  .app {
    max-width: 960px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* ============ CARD ============ */
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: var(--shadow-card);
    transition: background-color 0.3s ease, border-color 0.3s ease;
  }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(145deg, var(--bg-card), var(--bg-thead));
  }

  .card-title {
    font-size: 13px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ck-text);
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  body.lang-mm .card-title {
    font-size: 12.5px;
    letter-spacing: 0.02em;
    text-transform: none;
  }

  .live-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 999px;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ck-text);
    flex-shrink: 0;
    white-space: nowrap;
  }

  body.lang-mm .live-badge {
    font-size: 9px;
    letter-spacing: 0.02em;
    text-transform: none;
    padding: 4px 8px;
    gap: 5px;
  }

  .live-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #eab308;
    animation: livePulse 1.4s ease-in-out infinite;
    flex-shrink: 0;
  }
  .live-dot.state-connecting { background: #eab308; }
  .live-dot.state-connected {
    background: var(--green);
    animation: livePulseGreen 2s ease-in-out infinite;
  }
  .live-dot.state-error { background: var(--red); animation: livePulse 0.9s ease-in-out infinite; }

  @keyframes livePulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.75); }
  }
  @keyframes livePulseGreen {
    0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.6); }
    70% { box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
    100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
  }

  /* ============ TABLE ============ */
  .table-scroll {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    min-width: 440px;
  }

  thead {
    background: var(--bg-thead);
  }

  th {
    padding: 10px 8px;
    text-align: left;
    font-size: 10.5px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--ck-text);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  body.lang-mm th {
    font-size: 10px;
    letter-spacing: 0.02em;
    text-transform: none;
  }

  th.col-no { width: 8%; padding-left: 14px; }
  th.col-period { width: 20%; }
  th.col-num { width: 12%; text-align: center; }
  th.col-color { width: 14%; text-align: center; }
  th.col-bs { width: 18%; text-align: center; }
  th.col-premium { width: 28%; }

  td {
    padding: 11px 8px;
    border-bottom: 1px solid var(--border-soft);
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    vertical-align: middle;
    line-height: 1.3;
    background: var(--bg-card);
    transition: background-color 0.15s ease;
  }

  td.col-no {
    padding-left: 14px;
    color: var(--text-muted);
    font-weight: 700;
    font-size: 12px;
  }

  td.col-period {
    font-weight: 700;
    color: var(--text);
    letter-spacing: 0.02em;
  }

  td.col-num {
    text-align: center;
    font-weight: 800;
    font-size: 14px;
    color: var(--text);
  }

  td.col-color { text-align: center; }
  td.col-bs { text-align: center; }
  td.col-premium { padding-right: 14px; }

  tbody tr:last-child td { border-bottom: none; }

  @media (hover: hover) and (pointer: fine) {
    tbody tr:hover td { background: var(--bg-hover); }
  }

  /* ============ ROW ANIMATIONS ============ */
  @keyframes rowSlideIn {
    from { opacity: 0; transform: translateY(-14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes rowHighlightFlash {
    0%   { background-color: rgba(34, 197, 94, 0.28); }
    60%  { background-color: rgba(34, 197, 94, 0.14); }
    100% { background-color: transparent; }
  }

  tr.row-initial {
    animation: rowSlideIn 0.42s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  tr.row-new {
    animation: rowSlideIn 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  tr.row-new td {
    animation: rowHighlightFlash 2.2s ease-out;
  }

  @media (prefers-reduced-motion: reduce) {
    tr.row-initial, tr.row-new, tr.row-new td { animation: none; }
  }

  /* ============ COLORS ============ */
  .colour-cell {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }

  .colour-dot {
    width: 15px;
    height: 15px;
    border-radius: 50%;
    flex-shrink: 0;
    box-shadow: 0 0 0 2px var(--bg-card), 0 1px 3px rgba(0,0,0,0.15);
  }
  .colour-dot--green { background: var(--green); }
  .colour-dot--red { background: var(--red); }
  .colour-dot--violet { background: var(--violet); }

  .colour-duo {
    display: inline-flex;
    align-items: center;
    gap: 3px;
  }
  .colour-duo .colour-dot { width: 13px; height: 13px; }

  .colour-unknown {
    color: var(--text-subtle);
    font-weight: 600;
    font-size: 12px;
  }

  /* ============ BADGES ============ */
  .badge {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    line-height: 1.2;
  }
  .badge-big {
    background: rgba(202, 138, 4, 0.12);
    color: var(--yellow);
  }
  .badge-small {
    background: rgba(79, 70, 229, 0.12);
    color: var(--ck-text);
  }
  body.dark-mode .badge-big {
    background: rgba(251, 191, 36, 0.15);
    color: var(--yellow);
  }
  body.dark-mode .badge-small {
    background: rgba(129, 140, 248, 0.18);
    color: var(--ck-text);
  }

  body.lang-mm .badge {
    font-size: 10px;
    letter-spacing: 0.01em;
    text-transform: none;
  }

  .premium-code {
    display: inline-block;
    padding: 4px 8px;
    background: var(--bg-thead);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 11px;
    font-weight: 800;
    color: #000000;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    vertical-align: middle;
  }

  body.dark-mode .premium-code {
    color: #f1f5f9;
  }

  /* ============ EMPTY STATE ============ */
  .empty-state {
    padding: 56px 20px;
    text-align: center;
    color: var(--text-muted);
  }
  .empty-icon {
    width: 60px;
    height: 60px;
    margin: 0 auto 16px;
    color: var(--text-subtle);
    opacity: 0.5;
  }
  .empty-title {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 6px;
    color: var(--text);
  }
  .empty-hint {
    font-size: 12px;
    color: var(--text-subtle);
    font-weight: 500;
  }

  /* ============ LAST UPDATE ============ */
  .last-update {
    text-align: center;
    color: var(--text-subtle);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.02em;
    padding: 2px 0;
  }

  body.lang-mm .last-update {
    font-size: 11.5px;
    letter-spacing: 0;
  }

  /* ============ TOAST ============ */
  .toast-container {
    position: fixed;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20000;
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
    max-width: 90vw;
    width: max-content;
  }
  .toast {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 16px;
    border-radius: 12px;
    font-size: 12.5px;
    font-weight: 700;
    box-shadow: 0 4px 20px rgba(0,0,0,0.14);
    display: flex;
    align-items: center;
    gap: 8px;
    opacity: 0;
    transform: translateY(-10px);
    transition: opacity 0.25s ease, transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    white-space: nowrap;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .toast::before {
    content: '';
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
    background: var(--ck-2);
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast-success { border-color: var(--green); color: #15803d; }
  .toast-success::before { background: var(--green); }
  .toast-error { border-color: var(--red); color: #b91c1c; }
  .toast-error::before { background: var(--red); }
  .toast-info { border-color: var(--ck-2); color: var(--ck-text); }
  body.dark-mode .toast-success { color: #86efac; }
  body.dark-mode .toast-error { color: #fca5a5; }
  body.dark-mode .toast-info { color: #a5b4fc; }

  /* ============ RESPONSIVE ============ */
  @media (max-width: 480px) {
    body { padding: 8px; }
    .app { gap: 10px; }
    .card { border-radius: 12px; }
    .card-header { padding: 10px 12px; }
    .card-title { font-size: 11.5px; letter-spacing: 0.06em; }
    body.lang-mm .card-title { font-size: 11px; }
    .live-badge { font-size: 9px; padding: 3px 8px; }
    body.lang-mm .live-badge { font-size: 8.5px; padding: 3px 7px; }
    th { padding: 8px 6px; font-size: 9.5px; }
    body.lang-mm th { font-size: 9px; }
    td { padding: 9px 6px; font-size: 12px; }
    td.col-no { font-size: 11px; }
    td.col-num { font-size: 13px; }
    th.col-no { padding-left: 10px; }
    td.col-no { padding-left: 10px; }
    td.col-premium { padding-right: 10px; }
    .colour-dot { width: 13px; height: 13px; }
    .colour-duo .colour-dot { width: 11px; height: 11px; }
    .badge { font-size: 10px; padding: 2px 6px; }
    body.lang-mm .badge { font-size: 9px; }
    .premium-code { font-size: 10px; padding: 3px 6px; }
  }

  @media (max-width: 380px) {
    th.col-premium, td.col-premium { display: none; }
    th.col-period { width: 24%; }
    th.col-bs { width: 22%; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="card">
    <div class="card-header">
      <span class="card-title" data-en="SIXWIN WINGO 30 HISTORY" data-mm="SIXWIN WINGO 30 မှတ်တမ်း">SIXWIN WINGO 30 HISTORY</span>
      <span class="live-badge">
        <span class="live-dot state-connecting" id="liveDot"></span>
        <span data-en="LIVE" data-mm="တိုက်ရိုက်ထုတ်လွှင့်မှု">LIVE</span>
      </span>
    </div>
    <div id="tableContainer"></div>
  </div>
  <div class="last-update" id="lastUpdate" style="display: none;"></div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
  // ============ CONFIG ============
  const firebaseConfig = {
    apiKey: "AIzaSyDj6z3O91NnlQ1zVdripiGhqQMsQhR4_ak",
    authDomain: "ck30-35e97.firebaseapp.com",
    databaseURL: "https://ck30-35e97-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "ck30-35e97",
    storageBucket: "ck30-35e97.appspot.com",
    messagingSenderId: "625630152314",
    appId: "1:625630152314:web:c035009eec389371b51dc3",
    measurementId: "G-6Z7DYPKHR2"
  };

  const FIREBASE_PATH = "6wingo30/default";
  const THEME_KEY = 'appTheme';
  const LANG_KEY = 'appLang';

  // ============ STATE ============
  let db = null;
  let firebaseListener = null;
  let currentLang = localStorage.getItem(LANG_KEY) || 'en';
  let lastResults = null;
  let lastTimestamp = null;
  let lastIssueSet = new Set();
  let hasRenderedOnce = false;
  let connectionState = 'connecting';
  let lastToastCount = null;
  let connectedToastTimer = null;

  // ============ TRANSLATIONS ============
  const T = {
    en: {
      connected: 'Connected — {n} records',
      noData: 'No data found. Waiting...',
      loadError: 'Load error: ',
      connectionError: 'Connection error: ',
      emptyTitle: 'No history data available',
      emptyHint: 'Waiting for data...',
      lastUpdate: 'Last updated: ',
      big: 'BIG',
      small: 'SMALL'
    },
    mm: {
      connected: 'ချိတ်ဆက်ပြီး — စရင်း {n} ခု',
      noData: 'ဒေတာမတွေ့ပါ။ စောင့်ဆိုင်းနေသည်...',
      loadError: 'ဖွင့်မရပါ: ',
      connectionError: 'ချိတ်ဆက်မှု အမှား: ',
      emptyTitle: 'မှတ်တမ်း ဒေတာ မရှိပါ',
      emptyHint: 'ဒေတာ စောင့်ဆိုင်းနေသည်...',
      lastUpdate: 'နောက်ဆုံး အပ်ဒိတ်: ',
      big: 'အကြီး',
      small: 'အသေး'
    }
  };

  // ============ MYANMAR NUMERALS ============
  const MM_DIGITS = ['၀','၁','၂','၃','၄','၅','၆','၇','၈','၉'];
  function toMmNum(str) {
    if (str === null || str === undefined) return '';
    return String(str).replace(/[0-9]/g, d => MM_DIGITS[+d]);
  }
  function num(value) {
    if (value === null || value === undefined) return '';
    const str = String(value);
    return currentLang === 'mm' ? toMmNum(str) : str;
  }

  // ============ TOAST ============
  function showToast(message, type) {
    const container = document.getElementById('toastContainer');
    if (!container) return;
    const toast = document.createElement('div');
    toast.className = 'toast toast-' + (type || 'info');
    toast.textContent = message;
    container.appendChild(toast);
    requestAnimationFrame(() => toast.classList.add('show'));
    setTimeout(() => {
      toast.classList.remove('show');
      setTimeout(() => toast.remove(), 300);
    }, 2400);
  }

  // Debounced "connected" toast — only fires once per burst, and only if count changed
  function scheduleConnectedToast(count) {
    if (connectedToastTimer) clearTimeout(connectedToastTimer);
    connectedToastTimer = setTimeout(() => {
      if (count !== lastToastCount && count > 0) {
        const msg = T[currentLang].connected.replace('{n}', num(count));
        showToast(msg, 'success');
        lastToastCount = count;
      }
      connectedToastTimer = null;
    }, 800);
  }

  // ============ CONNECTION STATE ============
  function setConnectionState(state) {
    connectionState = state;
    const dot = document.getElementById('liveDot');
    if (dot) dot.className = 'live-dot state-' + state;
  }

  // ============ THEME ============
  function applyTheme(theme) {
    document.body.classList.toggle('dark-mode', theme === 'dark');
  }

  // ============ LANGUAGE ============
  function applyLanguage(lang) {
    currentLang = lang;
    localStorage.setItem(LANG_KEY, lang);
    document.documentElement.lang = lang === 'mm' ? 'my' : 'en';
    document.body.classList.toggle('lang-mm', lang === 'mm');

    document.querySelectorAll('[data-en][data-mm]').forEach(el => {
      const txt = el.getAttribute(lang === 'mm' ? 'data-mm' : 'data-en');
      if (txt !== null) el.textContent = txt;
    });

    if (lastResults !== null) {
      renderTable(lastResults, true);
    }
    if (lastTimestamp) {
      updateLastUpdateTime(lastTimestamp);
    }
  }

  // ============ BOOT ============
  function boot() {
    const savedTheme = localStorage.getItem(THEME_KEY) || 'light';
    applyTheme(savedTheme);
    applyLanguage(currentLang);
  }

  // ============ RECEIVE FROM PARENT ============
  window.addEventListener('message', function (event) {
    const data = event.data;
    if (!data || typeof data !== 'object') return;
    if (data.type !== 'app-sync') return;

    if (data.theme === 'dark' || data.theme === 'light') {
      applyTheme(data.theme);
      localStorage.setItem(THEME_KEY, data.theme);
    }
    if (data.language === 'en' || data.language === 'mm') {
      applyLanguage(data.language);
    }
  });

  window.addEventListener('storage', function (e) {
    if (e.key === THEME_KEY && e.newValue) applyTheme(e.newValue);
    if (e.key === LANG_KEY && e.newValue) applyLanguage(e.newValue);
  });

  // ============ FIREBASE ============
  function initializeFirebase() {
    try {
      let app;
      try {
        app = firebase.app('results');
      } catch (e) {
        app = firebase.initializeApp(firebaseConfig, 'results');
      }
      db = app.database();
      return true;
    } catch (error) {
      console.error('Firebase init error:', error);
      showToast(T[currentLang].connectionError + error.message, 'error');
      setConnectionState('error');
      return false;
    }
  }

  function classifyBigSmall(number) {
    if (number === null || number === undefined) return null;
    const n = parseInt(number, 10);
    if (isNaN(n)) return null;
    return n >= 5 ? 'BIG' : 'SMALL';
  }

  function resolveColour(result) {
    let colour = (result.colour || result.color || '').toLowerCase().trim();
    if (colour) return colour;
    const n = parseInt(result.number, 10);
    if (isNaN(n)) return '';
    if (n === 0) return 'red,violet';
    if (n === 5) return 'green,violet';
    if ([1, 3, 7, 9].includes(n)) return 'green';
    if ([2, 4, 6, 8].includes(n)) return 'red';
    return '';
  }

  function renderColourHtml(colour) {
    const c = (colour || '').toLowerCase().trim();
    if (c === 'green') {
      return '<span class="colour-cell"><span class="colour-dot colour-dot--green" title="Green"></span></span>';
    }
    if (c === 'red') {
      return '<span class="colour-cell"><span class="colour-dot colour-dot--red" title="Red"></span></span>';
    }
    if (c === 'green,violet' || c === 'violet,green') {
      return '<span class="colour-cell"><span class="colour-duo" title="Violet + Green">' +
        '<span class="colour-dot colour-dot--violet"></span>' +
        '<span class="colour-dot colour-dot--green"></span>' +
        '</span></span>';
    }
    if (c === 'red,violet' || c === 'violet,red') {
      return '<span class="colour-cell"><span class="colour-duo" title="Violet + Red">' +
        '<span class="colour-dot colour-dot--violet"></span>' +
        '<span class="colour-dot colour-dot--red"></span>' +
        '</span></span>';
    }
    return '<span class="colour-unknown">-</span>';
  }

  function formatPeriodNumber(issueNumber) {
    if (issueNumber === null || issueNumber === undefined || issueNumber === '') return '-';
    const str = String(issueNumber);
    return str.length > 5 ? str.slice(-5) : str;
  }

  function updateLastUpdateTime(timestamp) {
    lastTimestamp = timestamp;
    const el = document.getElementById('lastUpdate');
    if (!el) return;
    if (!timestamp) {
      el.style.display = 'none';
      return;
    }
    const date = new Date(timestamp);
    const dateStr = date.toLocaleString('en-US');
    const prefix = T[currentLang].lastUpdate;
    const dateFinal = currentLang === 'mm' ? toMmNum(dateStr) : dateStr;
    el.textContent = prefix + dateFinal;
    el.style.display = 'block';
  }

  // ============ RENDER TABLE (with animations) ============
  function renderTable(results, skipAnimation) {
    lastResults = results;
    const container = document.getElementById('tableContainer');
    if (!container) return;

    const t = T[currentLang];

    if (!results || results.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/>
          </svg>
          <p class="empty-title">${t.emptyTitle}</p>
          <p class="empty-hint">${t.emptyHint}</p>
        </div>
      `;
      lastIssueSet = new Set();
      hasRenderedOnce = false;
      return;
    }

    // Detect new rows (only if we had prior data)
    const currentSet = new Set(results.map(r => String(r.issueNumber)));
    const newRows = new Set();
    const isFirstRender = !hasRenderedOnce;
    if (!isFirstRender && lastIssueSet.size > 0) {
      results.forEach(r => {
        const id = String(r.issueNumber);
        if (!lastIssueSet.has(id)) newRows.add(id);
      });
    }

    const th = currentLang === 'mm'
      ? { no: 'နံပတ်', period: 'ကာလနံပတ်', num: 'နံပတ်', color: 'အရောင်', bs: 'အကြီး/အသေး', premium: 'ပရီမီယံ' }
      : { no: 'No.', period: 'Period', num: 'Num', color: 'Color', bs: 'B/S', premium: 'Premium' };

    let html = '<div class="table-scroll"><table><thead><tr>' +
      '<th class="col-no">' + th.no + '</th>' +
      '<th class="col-period">' + th.period + '</th>' +
      '<th class="col-num">' + th.num + '</th>' +
      '<th class="col-color">' + th.color + '</th>' +
      '<th class="col-bs">' + th.bs + '</th>' +
      '<th class="col-premium">' + th.premium + '</th>' +
      '</tr></thead><tbody>';

    results.forEach((result, index) => {
      const bs = classifyBigSmall(result.number);
      const bsLabel = bs === 'BIG' ? t.big : bs === 'SMALL' ? t.small : '-';
      const bsClass = bs === 'BIG' ? 'badge-big' : 'badge-small';
      const premium = result.premium || '-';
      const periodNumber = formatPeriodNumber(result.issueNumber);
      const numberDisplay = (result.number !== null && result.number !== undefined) ? result.number : '-';
      const colourHtml = renderColourHtml(resolveColour(result));

      const issueId = String(result.issueNumber);

      let rowClass = '';
      let rowStyle = '';

      if (!skipAnimation) {
        if (isFirstRender) {
          rowClass = 'row-initial';
          rowStyle = 'animation-delay:' + Math.min(index * 28, 700) + 'ms';
        } else if (newRows.has(issueId)) {
          rowClass = 'row-new';
        }
      }

      const classAttr = rowClass ? ' class="' + rowClass + '"' : '';
      const styleAttr = rowStyle ? ' style="' + rowStyle + '"' : '';

      html += '<tr' + classAttr + styleAttr + '>' +
        '<td class="col-no">' + num(index + 1) + '</td>' +
        '<td class="col-period">' + num(periodNumber) + '</td>' +
        '<td class="col-num">' + num(numberDisplay) + '</td>' +
        '<td class="col-color">' + colourHtml + '</td>' +
        '<td class="col-bs"><span class="badge ' + bsClass + '">' + bsLabel + '</span></td>' +
        '<td class="col-premium"><span class="premium-code">' + num(premium) + '</span></td>' +
        '</tr>';
    });

    html += '</tbody></table></div>';
    container.innerHTML = html;

    lastIssueSet = currentSet;
    hasRenderedOnce = true;
  }

  // ============ CONNECT ============
  function connectFirebase() {
    if (!db && !initializeFirebase()) return;

    setConnectionState('connecting');

    try {
      if (firebaseListener) {
        db.ref(FIREBASE_PATH).off('value', firebaseListener);
        firebaseListener = null;
      }

      firebaseListener = db.ref(FIREBASE_PATH).on('value', (snapshot) => {
        const data = snapshot.val();

        if (data && data.list && Array.isArray(data.list)) {
          renderTable(data.list, false);
          updateLastUpdateTime(data.publishedAt || Date.now());
          setConnectionState('connected');
          scheduleConnectedToast(data.list.length);
        } else {
          setConnectionState('connecting');
          renderTable([]);
        }
      }, (error) => {
        console.error('Firebase read error:', error);
        setConnectionState('error');
        showToast(T[currentLang].loadError + error.message, 'error');
      });
    } catch (error) {
      console.error('Connection error:', error);
      setConnectionState('error');
      showToast(T[currentLang].connectionError + error.message, 'error');
    }
  }

  // ============ INIT ============
  boot();

  document.addEventListener('DOMContentLoaded', function () {
    if (initializeFirebase()) {
      setTimeout(connectFirebase, 300);
    }
  });

  window.addEventListener('beforeunload', function () {
    if (firebaseListener && db) {
      db.ref(FIREBASE_PATH).off('value', firebaseListener);
    }
  });
</script>

</body>
</html>
